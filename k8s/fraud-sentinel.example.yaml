apiVersion: v1
kind: Namespace
metadata:
  name: fraud-sentinel
---
apiVersion: v1
kind: Secret
metadata:
  name: fraud-sentinel-env
  namespace: fraud-sentinel
type: Opaque
stringData:
  CONFLUENT_BOOTSTRAP_SERVERS: "your-cluster.confluent.cloud:9092"
  CONFLUENT_API_KEY: "YOUR_CONFLUENT_API_KEY"
  CONFLUENT_API_SECRET: "YOUR_CONFLUENT_API_SECRET"
  CONFLUENT_SCHEMA_REGISTRY_URL: "https://your-registry.confluent.cloud"
  CONFLUENT_SCHEMA_REGISTRY_KEY: "YOUR_SCHEMA_REGISTRY_KEY"
  CONFLUENT_SCHEMA_REGISTRY_SECRET: "YOUR_SCHEMA_REGISTRY_SECRET"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-sentinel
  namespace: fraud-sentinel
  labels:
    app: fraud-sentinel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fraud-sentinel
  template:
    metadata:
      labels:
        app: fraud-sentinel
    spec:
      containers:
      - name: sentinel
        image: fraud-sentinel:v5
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        envFrom:
        - secretRef:
            name: fraud-sentinel-env
        resources:
          requests:
            cpu: 200m
            memory: 300Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 8
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: fraud-sentinel-service
  namespace: fraud-sentinel
  labels:
    app: fraud-sentinel
spec:
  type: NodePort
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30888
    protocol: TCP
    name: http
  selector:
    app: fraud-sentinel
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fraud-sentinel-ingress
  namespace: fraud-sentinel
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - opssynergy.isroot.in
    secretName: opssynergy-tls-secret
  rules:
  - host: opssynergy.isroot.in
    http:
      paths:
      - path: /fraud
        pathType: Prefix
        backend:
          service:
            name: fraud-sentinel-service
            port:
              number: 8000
      - path: /sentinel
        pathType: Prefix
        backend:
          service:
            name: fraud-sentinel-service
            port:
              number: 8000
